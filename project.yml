name: IphoneBackupExplorer
options:
  bundleIdPrefix: co.uk.ketelle
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  IphoneBackupExplorer:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    entitlements:
      path: Resources/IphoneBackupExplorer.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: iPhone Backup Explorer
        CFBundleIconName: AppIcon
        CFBundleDisplayName: iPhone Backup Explorer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.uk.ketelle.IphoneBackupExplorer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
